[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "second-life-mcp"
version = "1.0.0"
description = "Source-attributed offline MCP tools for Second Life LSL and SLua"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSE.md"]
dependencies = ["mcp==2.3.0", "PyYAML>=6.0.3,<7"]

[project.urls]
Homepage = "https://github.com/voidel/second-life-mcp"
Issues = "https://github.com/voidel/second-life-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
second-life-mcp = "second_life_mcp.server:main"
lsl-mcp = "lsl_mcp.server:main"
slua-mcp = "slua_mcp.server:main"
second-life-import = "second_life_mcp.importer:main"
second-life-update = "second_life_mcp.update:main"
second-life-evaluate = "second_life_mcp.evaluation:main"
second-life-toolchains = "second_life_mcp.toolchains:main"
second-life-source-audit = "second_life_mcp.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
second_life_mcp = ["data/*.json", "data/*.luau"]

[tool.pytest.ini_options]
testpaths = ["tests"]
