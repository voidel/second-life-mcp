name: Audit official sources
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Optional immutable official definition commit; blank resolves main"
        required: false

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Generate reviewable reference candidate
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          args=(--output-dir candidate --cache-dir .source-cache)
          if [ -n "$SOURCE_REVISION" ]; then args+=(--revision "$SOURCE_REVISION"); fi
          second-life-update "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: reference-candidate
          path: candidate/
