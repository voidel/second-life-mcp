name: Publish release
on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --extra dev --python 3.12
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-sync python -c "import os; from second_life_mcp import __version__; assert os.environ['RELEASE_TAG'] == 'v' + __version__"
      - run: uv run --no-sync second-life-toolchains --output-dir .toolchains
      - run: uv run --no-sync python -m pytest
        env:
          SECOND_LIFE_MCP_TOOLCHAINS: ${{ github.workspace }}/.toolchains/toolchains.json
      - run: uv run --no-sync second-life-evaluate
      - run: uv run --no-sync python -m build
      - name: Hash distributions
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("dist")
          artifacts = sorted(root.glob("*.whl")) + sorted(root.glob("*.tar.gz"))
          assert len(artifacts) == 2
          (root / "SHA256SUMS.txt").write_text("".join(hashlib.sha256(path.read_bytes()).hexdigest() + "  " + path.name + "\n" for path in artifacts))
          PY
      - name: Publish tested distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt \
            --verify-tag --prerelease --title "Second Life MCP $RELEASE_TAG" \
            --notes "Offline LSL and SLua reference, resilient source updates, practical MCP evaluations, pinned local compiler checks, reviewed migration guidance and locked development dependencies. See the README for installation and compiler setup."
